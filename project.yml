# xcodegen spec — run `xcodegen generate` in this directory to produce HelixTradingApp.xcodeproj.
# Keeps the project file declarative and free of merge conflicts vs hand-rolled .pbxproj.

name: HelixTradingApp
options:
  bundleIdPrefix: club.helixtrading
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en

# Explicit schemes — defining ANY scheme stops xcodegen's per-target
# auto-scheme generation, so both apps are listed. The Mac scheme wires
# HelixTradingAppTests into its test action (`xcodebuild test`).
schemes:
  HelixTradingApp:
    build:
      targets:
        HelixTradingApp: all
        HelixTradingAppTests: [test]
    test:
      targets:
        - HelixTradingAppTests
  HelixTradingAppiPad:
    build:
      targets:
        HelixTradingAppiPad: all

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Allows debug builds without a paid developer account.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # SwiftUI previews + macOS app need this on.
    ENABLE_PREVIEWS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

targets:
  HelixTradingApp:
    type: application
    platform: macOS
    sources:
      - path: GoldMonitorMac
      - path: GoldMonitorMac/Resources
    resources:
      - path: GoldMonitorMac/Resources/Assets.xcassets
    dependencies:
      - package: GRDB
        product: GRDB
      - package: MarkdownUI
        product: MarkdownUI
    info:
      path: GoldMonitorMac/Info.plist
      properties:
        CFBundleName: HelixTrading
        CFBundleDisplayName: Helix Trading App
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "8"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Helix Trading Club. All rights reserved."
        NSAppTransportSecurity:
          # Open ATS — the app connects to user-configured backends which
          # may be on plain HTTP / local IPs (e.g. http://192.168.x.x:5173
          # for a server on the same LAN). Locking this down would force
          # every user to add their own NSExceptionDomains entry.
          # We're not on the App Store; this trade is acceptable.
          NSAllowsArbitraryLoads: true
        # No mic/camera/location — explicitly omit usage strings.
        LSApplicationCategoryType: public.app-category.finance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.helixtrading.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  HelixTradingAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GoldMonitorMacTests
    dependencies:
      - target: HelixTradingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.helixtrading.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HelixTradingAppiPad:
    type: application
    platform: iOS
    sources:
      - path: GoldMonitorMac
        excludes:
          - "**/Resources/**"
          - "**/ClaudeEngine.swift"
          - "**/CodexEngine.swift"
          - "**/ClaudeModelCatalog.swift"
          - "**/WindowConfigurator.swift"
          - "**/ChartView.swift"
          - "**/RootView.swift"
          - "**/HelixTradingApp.swift"
          - "**/DashboardView.swift"
          - "**/SidebarView.swift"
          - "**/SettingsView.swift"
          - "**/AnalysisPage.swift"
          - "**/ScrollZoomCatcher.swift"
          - "**/DrawingDeleteKeyHandler.swift"
          - "**/WhatsNewView.swift"
          - "**/WizardView.swift"
          - "**/ReleaseNotes.swift"
          - "**/UpdateChecker.swift"
          - "**/FetcherTimerView.swift"
          - "**/JournalDayAISheet.swift"
          - "**/JournalAISheet.swift"
          - "**/ChartControlsFAB.swift"
          - "**/DebugLogSheet.swift"
          - "**/DrawingInspector.swift"
          - "**/ChartSkeleton.swift"
          - "**/RiskCalculatorView.swift"
          - "**/UpdatesCard.swift"
          - "**/AnalysisActionDock.swift"
          - "**/AnalysisAspectCard.swift"
          - "**/AnalysisHistoryView.swift"
          - "**/AnalysisPlansColumn.swift"
          - "**/AnalysisReportColumn.swift"
          - "**/Info.plist"
      - path: ipadapp/HelixTradingApp-iPad
    resources:
      - path: ipadapp/HelixTradingApp-iPad/Resources/Assets.xcassets
      - path: ipadapp/HelixTradingApp-iPad/Resources/LaunchScreen.storyboard
    dependencies:
      - package: GRDB
        product: GRDB
      - package: MarkdownUI
        product: MarkdownUI
    info:
      path: ipadapp/HelixTradingApp-iPad/Info.plist
      properties:
        CFBundleName: HelixTrading
        CFBundleDisplayName: Helix Trading
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.finance
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.helixtrading.app.ipad
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 1,2 = iPhone + iPad (was iPad-only). The UI adapts to compact
        # width via AppMetrics / AdaptiveRootView.
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
